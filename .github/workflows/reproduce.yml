name: Reproduction integrity and tables
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r environment/requirements-lock.txt
      - run: python scripts/verify_release.py
      - run: python scripts/reproduce_estimates.py
      - run: python scripts/verify_estimates.py
      - run: python scripts/reproduce_tables.py
      # Arial is proprietary; publication rendering is validated separately
      # with a licensed local font installation. No CI font download occurs.
